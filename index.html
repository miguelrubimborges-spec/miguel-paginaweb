<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>blog</title>
        <style>
            header {
                background-color: #000000;
                color: #FF9100;
                text-align: center;
                max-width: 800px; 
                margin: 0 auto;
                padding: 16px;
                border: 2px solid #db1010;
            }
            main {
                background-color: #000000;
                color: #FF9100;
                text-align: center;
                max-width: 800px; 
                margin: 0 auto;
                padding: 16px;
            }
            /* Regra para diminuir a imagem mantendo a proporção */
            main img {
                max-width: 300px; /* Ajuste aqui: mude para o tamanho desejado (ex: 200px, 40%, etc.) */
                width: 100%;       /* Garante responsividade em telas menores */
                height: auto;
            }
            /* Regra para garantir o texto centralizado na div */
            main div {
                text-align: center;
            }

            /* --- ESTILOS DO BOTÃO E ANIMAÇÃO --- */
            button {
                background-color: #222222;
                color: #FF9100;
                border: 1px solid #FF9100;
                padding: 8px 16px;
                border-radius: 20px;
                cursor: pointer;
                font-size: 1rem;
                transition: background-color 0.2s;
                margin-top: 10px;
            }

            button:hover {
                background-color: #333333;
            }

            /* Animação de pulso */
            @keyframes pulsar {
                0% { transform: scale(1); }
                50% { transform: scale(1.2); }
                100% { transform: scale(1); }
            }

            /* Classe ativada via JavaScript */
            .animar {
                animation: pulsar 0.3s ease-in-out;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Meu blog tech</h1>
            <p>Vou compartilhar conhecimentos sobre tecnologia e programação</p>
        </header>

        <main>
            <img src="wifi.png" alt="Imagem de wifi">
            <div>
                <h2>Meu primeiro post</h2>
                <p>Por: Miguel Borges</p>
                <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.</p>
                <button>❤️ <span>0</span></button>
            </div>
        </main>

        <script>
            const botao = document.querySelector("button");
            const contador = document.querySelector("button span");

            botao.addEventListener("click", botaoClicado);

            function botaoClicado() { 
                console.log("fui clicado");
                // Incrementa a contagem de curtidas
                let curtidas = parseInt(contador.textContent);
                curtidas++;
                contador.textContent = curtidas;

                // Reinicia a animação a cada clique
                botao.classList.remove("animar");
                void botao.offsetWidth; // Força o recálculo de layout do navegador para reiniciar a animação
                botao.classList.add("animar");
            }
        </script>
    </body>
</html>
