<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>blog</title>
        <style>
            header{
                background-color:  #000000;
                color: #FF9100;
                text-align: center;
                max-width: 800px; 
                margin: 0 auto;
                padding: 16PX;
                border: #db1010;
            }
            main{
                background-color:  #000000;
                color: #FF9100;
                text-align: center;
                max-width: 800px; 
                margin: 0 auto;
                padding: 16PX;
            }
            /* Regra para diminuir a imagem */
            main img {
                max-width: 80%;
                height: auto;
            }
            /* Regra para garantir o texto centralizado na div */
            main div {
                text-align: center;
            }
        </style>
        
    </head>
    <body>
        <header>
        <h1>Meu blog tech</h1>
        <p>Vou compartilhar conhecimentos sobre tecnologia e programação</p>
        </header>

        <main>
        <img src="wifi.png" alt="Imagem de wifi">
        <div>
            <h2>Meu primeiro post</h2>
            <p>Por: Miguel Borges</p>
            <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da area de tecnologia.</p>
        </div>
        </main>
     </body>
</html>
